<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3b82f6" />
    <title>mibale — מי בא? (הדגמה)</title>
    <meta name="description" content="גרסת הדגמה חיה של mibale: אירועים, קהילות, סטוריז והיכרויות — עם נתוני דוגמה." />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <script>
      try {
        var t = localStorage.getItem("mibale-theme");
        if (t === "dark" || ((!t || t === "system") && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
