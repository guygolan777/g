name: Supabase database setup

# Applies drizzle/migrations/*.sql (in order) to the Supabase project, and optionally the sample data.
# Migrations are tracked in public.schema_migrations, so running it again only applies new files.
#
# Uses ONE of these repository secrets:
#   SUPABASE_ACCESS_TOKEN (recommended) — supabase.com/dashboard/account/tokens → "Generate new token";
#                                         runs SQL through the Supabase Management API, no DB password needed.
#                                         Also needs VITE_SUPABASE_URL (to know the project).
#   SUPABASE_DB_URL                      — Connect → "Session pooler" connection string (with the DB password).
on:
  workflow_dispatch:
    inputs:
      seed:
        description: "Also load the original sample data (10 demo profiles, events, communities)"
        type: boolean
        default: false
      demo20:
        description: "Also load 20 demo users (each with an event and a community, some in dating mode)"
        type: boolean
        default: false
      admin_email:
        description: "Make the account with this email an admin (it must have signed up already)"
        type: string
        default: ""

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_URL: ${{ secrets.VITE_SUPABASE_URL }}
      DB: ${{ secrets.SUPABASE_DB_URL }}
      SEED: ${{ inputs.seed }}
      DEMO20: ${{ inputs.demo20 }}
      ADMIN_EMAIL: ${{ inputs.admin_email }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations
        run: |
          set -euo pipefail
          if [ -n "$TOKEN" ]; then
            REF=$(echo "$PROJECT_URL" | sed -E 's#https?://([a-z0-9]+)\..*#\1#')
            [ -n "$REF" ] || { echo "::error::VITE_SUPABASE_URL secret is missing"; exit 1; }
            echo "Using the Management API for project $REF"
            run_sql() { # $1 = SQL text; prints the JSON result
              jq -Rs '{query: .}' <<<"$1" | curl -sS --fail-with-body -X POST \
                -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
                "https://api.supabase.com/v1/projects/$REF/database/query" -d @-
            }
          else
            [ -n "$DB" ] || { echo "::error::Add the SUPABASE_ACCESS_TOKEN (or SUPABASE_DB_URL) repository secret"; exit 1; }
            # Show the non-secret parts so a wrong user/host is easy to spot.
            echo "Connecting as user '$(echo "$DB" | sed -E 's#^postgres(ql)?://([^:]+):.*#\2#')' to host '$(echo "$DB" | sed -E 's#.*@([^:/]+).*#\1#')'"
            run_sql() { psql "$DB" -v ON_ERROR_STOP=1 -q -1 -At -f - <<<"$1"; }
          fi

          run_sql "create table if not exists public.schema_migrations (name text primary key, applied_at timestamptz not null default now()); revoke all on public.schema_migrations from anon, authenticated;" >/dev/null
          applied=$(run_sql "select coalesce(string_agg(name, ' '), '') as names from public.schema_migrations")
          for f in drizzle/migrations/*.sql; do
            name=$(basename "$f")
            if grep -q "$name" <<<"$applied"; then echo "✓ $name (already applied)"; continue; fi
            echo "→ $name"
            run_sql "$(cat "$f")" >/dev/null
            run_sql "insert into public.schema_migrations (name) values ('$name')" >/dev/null
          done
          if [ "$SEED" = "true" ]; then
            echo "→ seed.sql"
            run_sql "$(cat drizzle/seed.sql)" >/dev/null
            echo "Sample data loaded (password for all demo users: mibale1234)"
          fi
          if [ "$DEMO20" = "true" ]; then
            echo "→ seed-demo20.sql"
            run_sql "$(cat drizzle/seed-demo20.sql)" >/dev/null
            echo "20 demo users loaded (password for all: mibale1234)"
          fi
          if [ -n "$ADMIN_EMAIL" ]; then
            email=$(echo "$ADMIN_EMAIL" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
            [[ "$email" =~ ^[a-z0-9._%+-]+@[a-z0-9.-]+$ ]] || { echo "::error::Not an email address"; exit 1; }
            found=$(run_sql "insert into public.user_roles (user_id, role) select id, 'admin' from auth.users where lower(email) = '$email' on conflict do nothing; select count(*) as n from auth.users where lower(email) = '$email';")
            if grep -qE '(^|[^0-9])0([^0-9]|$)' <<<"$found"; then
              echo "::error::No account with that email — sign up in the app first, then run this again"; exit 1
            fi
            echo "Admin role granted to $email 🛡️ (open the app → Settings → ניהול המערכת)"
          fi
          echo "Database is ready ✅"
