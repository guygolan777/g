name: Supabase database setup

# Applies drizzle/migrations/*.sql (in order) to the Supabase project, and optionally the sample data.
# Needs one repository secret: SUPABASE_DB_URL — Supabase → Connect → "Session pooler" connection
# string (postgresql://postgres.<ref>:<password>@aws-…pooler.supabase.com:5432/postgres).
# Migrations are tracked in public.schema_migrations, so running it again only applies new files.
on:
  workflow_dispatch:
    inputs:
      seed:
        description: "Also load the sample data (10 demo profiles, events, communities)"
        type: boolean
        default: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      DB: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secret
        run: '[ -n "$DB" ] || { echo "::error::Add the SUPABASE_DB_URL repository secret first"; exit 1; }'
      - name: Apply migrations
        run: |
          psql "$DB" -v ON_ERROR_STOP=1 -qc "create table if not exists public.schema_migrations (name text primary key, applied_at timestamptz not null default now()); revoke all on public.schema_migrations from anon, authenticated;"
          for f in drizzle/migrations/*.sql; do
            name=$(basename "$f")
            if [ "$(psql "$DB" -Atc "select 1 from public.schema_migrations where name = '$name'")" = "1" ]; then
              echo "✓ $name (already applied)"; continue
            fi
            echo "→ $name"
            psql "$DB" -v ON_ERROR_STOP=1 -q -1 -f "$f"
            psql "$DB" -qc "insert into public.schema_migrations (name) values ('$name')"
          done
      - name: Load sample data
        if: ${{ inputs.seed }}
        run: |
          psql "$DB" -v ON_ERROR_STOP=1 -q -1 -f drizzle/seed.sql
          echo "Sample data loaded (password for all demo users: mibale1234)"
