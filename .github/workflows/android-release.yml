name: Android release (Google Play)

# Builds the app against the real Supabase project.
#   With the upload keystore secrets: signed mibale-release.aab (Google Play) + mibale-release.apk.
#   Without them: an installable test APK (debug-signed), published to the "live-apk" release.
# Run it from Actions → "Android release (Google Play)" → Run workflow.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY   – Supabase project (public values)
#   VITE_SITE_URL                               – optional, e.g. https://mibale.app
#   ANDROID_KEYSTORE_BASE64                     – optional: upload keystore (.jks), base64-encoded
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   GOOGLE_SERVICES_JSON                        – optional, Firebase config for push notifications
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version shown in the store (e.g. 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
      VITE_PHONE_VERIFICATION: ${{ secrets.VITE_PHONE_VERIFICATION }}
      VITE_OTP_CHANNELS: ${{ secrets.VITE_OTP_CHANNELS }}
      VITE_AUTH_PROVIDERS: ${{ secrets.VITE_AUTH_PROVIDERS }}
      VITE_PUSH_ENABLED: ${{ secrets.GOOGLE_SERVICES_JSON != '' && '1' || '' }}
      MIBALE_VERSION_CODE: ${{ github.run_number }}
      MIBALE_VERSION_NAME: ${{ inputs.version_name }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Check required secrets
        run: |
          missing=""
          for v in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY; do [ -n "${!v}" ] || missing="$missing $v"; done
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Build web bundle (SPA for Capacitor)
        run: CAP_BUILD=1 npx vite build
      - run: npx cap sync android
      - name: Firebase config for push (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json; fi
      - name: Decode upload keystore
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "MIBALE_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build signed AAB and APK
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        working-directory: android
        env:
          MIBALE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MIBALE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MIBALE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease assembleRelease --no-daemon
          cp app/build/outputs/bundle/release/app-release.aab ../mibale-release.aab
          cp app/build/outputs/apk/release/app-release.apk ../mibale-release.apk
      - uses: actions/upload-artifact@v4
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        with:
          name: mibale-release-${{ inputs.version_name }}-${{ github.run_number }}
          path: |
            mibale-release.aab
            mibale-release.apk

      - name: Build test APK (no upload key yet)
        if: ${{ env.HAS_KEYSTORE != 'true' }}
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../mibale-live.apk
      - name: Publish to the live-apk release
        if: ${{ env.HAS_KEYSTORE != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: live-apk
          name: mibale — APK מחובר לשרת
          prerelease: true
          make_latest: false
          body: |
            גרסת בדיקה מחוברת ל-Supabase האמיתי (${{ inputs.version_name }}, build ${{ github.run_number }}).
            הורידו את mibale-live.apk בטלפון והתקינו. זו לא הגרסה לחנות — לחנות צריך מפתח חתימה.
          files: mibale-live.apk
